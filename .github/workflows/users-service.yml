name: users-service

on:
  push:
    branches: ['**']
    tags: ['*']
    paths: &paths
      - 'users-service/**'
      - '.github/workflows/users-service.yml'
      - '.github/workflows/docker-image.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: users-service-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: users-service

jobs:
  quality:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: users-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Unit tests
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: users-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  image:
    name: Docker image
    needs: [test, audit]
    uses: ./.github/workflows/docker-image.yml
    with:
      service: users-service
    permissions:
      contents: read
      packages: write
