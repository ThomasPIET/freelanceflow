name: front

on:
  push:
    branches: ['**']
    tags: ['*']
    paths: &paths
      - 'front/**'
      - '.github/workflows/front.yml'
      - '.github/workflows/docker-image.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: front-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: front

jobs:
  quality:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc --noEmit
  test:
    name: Unit tests
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm audit --omit=dev --audit-level=high

  image:
    name: Docker image
    needs: [test, audit]
    uses: ./.github/workflows/docker-image.yml
    with:
      service: front
    permissions:
      contents: read
      packages: write
