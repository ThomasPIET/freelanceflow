# Une seule définition pour tous les environnements : les valeurs viennent du fichier d'env.
#   dev  : docker compose up --build                         (lit .env)
#   test : docker compose --env-file env/test.env up -d --build
#   uat  : docker compose --env-file env/uat.env up -d --build
#   prod : docker compose --env-file env/prod.env up -d --build
# Chaque fichier fixe COMPOSE_PROJECT_NAME : conteneurs, réseaux et volumes sont séparés par environnement.

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-database-url: &database-url postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

services:
  db:
    <<: *service
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { memory: 128M }
    networks:
      - db

  backend:
    <<: *service
    build: ./back
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: *database-url
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL manquant}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD manquant}
      PDF_SERVICE_URL: http://pdf-service:3000
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-factures@freelanceflow.local}
    depends_on:
      db:
        condition: service_healthy
      pdf-service:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
        reservations: { memory: 64M }
    networks:
      - app
      - db

  users-service:
    <<: *service
    build: ./users-service
    environment:
      DATABASE_URL: *database-url
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant}
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
        reservations: { memory: 64M }
    networks:
      - app
      - db

  pdf-service:
    <<: *service
    build: ./pdf-service
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
        reservations: { memory: 64M }
    networks:
      - app

  # Boîte mail de test : démarrée seulement avec le profil « mail » (dev, test, uat)
  mailpit:
    <<: *service
    image: axllent/mailpit:v1.32.0
    profiles: ["mail"]
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
    networks:
      - app

  frontend:
    <<: *service
    build:
      context: ./front
      args:
        BACKEND_URL: http://backend:3000
        USERS_SERVICE_URL: http://users-service:8000
    ports:
      - "${FRONT_PORT:-3001}:3000"
    depends_on:
      backend:
        condition: service_healthy
      users-service:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { memory: 128M }
    networks:
      - app

networks:
  app:
  db:
    internal: true

volumes:
  pgdata:
